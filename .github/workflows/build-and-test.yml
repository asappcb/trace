name: Build and Test

# Native GitHub CI for the asappcb/trace fork (upstream KiCad's real CI is on GitLab; this makes the
# fork self-sufficient). Builds in KiCad's public CI container so we don't reimplement the very
# large dependency stack, then runs the Boost/CTest QA suite. A fast-fail clang-format job runs in
# parallel, and a report job surfaces test results inline on the PR.

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'Documentation/**'
      - 'LICENSE*'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'Documentation/**'
      - 'LICENSE*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Fedora QABUILD + QA
    # Build every push to master, but skip draft PRs to save runner time.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/kicad/kicad-ci/source_containers/master/fedora:41
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: "5G"
      CTEST_OUTPUT_ON_FAILURE: "1"
      BOOST_TEST_CATCH_SYSTEM_ERRORS: "no"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore ccache
        # restore + explicit save (below) instead of actions/cache, which does NOT save on a failed
        # job -- so a failing test step would otherwise discard the whole build cache and force the
        # next run to rebuild cold.
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-fedora-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-fedora-${{ github.ref_name }}-
            ccache-fedora-master-
            ccache-fedora-

      - name: Configure (QABUILD)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=QABUILD \
            -DKICAD_STDLIB_LIGHT_DEBUG=ON \
            -DKICAD_TEST_XML_OUTPUT=ON \
            -DKICAD_USE_CMAKE_FINDPROTOBUF=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: ninja -C build

      - name: Save ccache
        # Save with the unique per-run key even when a later step fails, so the next run starts warm.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-fedora-${{ github.ref_name }}-${{ github.run_id }}

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: Run QA tests
        # Run the suites in parallel (qa_eeschema alone is ~5 min; the build is ccache-fast on warm
        # runs, so the test phase is the long pole).
        # Temporarily excluded (both stay covered by upstream's GitLab CI):
        #   qa_cli                                - kicad-cli SIGSEGVs in this container (issue #68)
        #   qa_diff_merge_mergetool_workflow_e2e  - interactive mergetool under xvfb; sibling still runs
        run: |
          cd build/qa
          ctest -j"$(nproc)" --output-on-failure --output-junit test_results.xml \
            --exclude-regex '^(qa_cli|qa_diff_merge_mergetool_workflow_e2e)$'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-test-results
          path: |
            build/qa/**/*.xml
          if-no-files-found: ignore

  report:
    name: Publish test report
    needs: build-and-test
    # Run even when the build/test job failed (that is when the inline report is most useful), but
    # not when it was skipped (draft PR / paths-ignore).
    if: always() && needs.build-and-test.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        # test-reporter runs `git ls-files` to relate results to sources, so it needs the repo.
        uses: actions/checkout@v4

      - name: Download test results
        uses: actions/download-artifact@v4
        continue-on-error: true # no artifact when the build failed before producing XML
        with:
          name: qa-test-results
          path: test-results

      - name: Publish JUnit report
        uses: dorny/test-reporter@v1
        with:
          name: QA test results
          path: 'test-results/**/test_results.xml'
          reporter: java-junit
          fail-on-error: false # the build-and-test job is the gate; never fail solely on reporting
          fail-on-empty: false # a missing/empty report must not fail this non-gating job

  format:
    name: clang-format
    # PR-only fast-fail, mirroring upstream's GitLab MR formatting check. Runs in parallel with the
    # build so a formatting slip is caught in seconds rather than after a full build cycle.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/kicad/kicad-ci/source_containers/master/fedora:41
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check formatting of changed lines
        # Reuse KiCad's own tool (same container upstream uses), so the clang-format version and the
        # clang-format-kicad git attribute exactly match the project's expectations.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin ${{ github.event.pull_request.base.ref }}
          MERGE_BASE=$(git merge-base origin/${{ github.event.pull_request.base.ref }} HEAD)
          echo "Checking formatting since $MERGE_BASE"
          ./tools/check_coding.sh --diff --ci --commit "$MERGE_BASE"
